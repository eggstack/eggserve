    "Response headers (Content-Type, Content-Length, ETag, etc.) are now propagated",
    "In-memory bodies (errors, small responses) are extracted and propagated",
    "File-backed streaming bodies remain ResponseBody::Empty (runtime streams directly)",
]
platform = "all"
deterministic = true

[finding.gates_invalidated]
