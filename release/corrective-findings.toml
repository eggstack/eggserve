# Plan 075 — Track B: Finding Registry + Track C: Reproduction Inventory
# Plan 090 — Track A: Implementation/evidence state model
#
# Machine-readable registry of all corrective findings from Plan 074.
# Each finding has a stable ID, severity, owning plan, and separate
# implementation and evidence status fields (Plan 090 schema v2).

[meta]
schema_version = "2.0.0"
plan = 75
tracks = ["B", "C"]
title = "Corrective Finding Registry"
baseline_sha = "e3782abd971902e63a6b33d52b7a472da63e2310"

# ──────────────────────────────────────────────────────────────────────
# Schema v2 fields (Plan 090 Track A):
#   implementation_status — not-started | in-progress | implemented | reopened
#   evidence_status       — missing | blocked | stale | partial | passed | not-required
#   implementation_sha    — commit that implemented the fix
#   evidence_sha          — commit that produced qualification evidence
#   required_gates        — gates that must pass before finding is fully closed
#   blocking_reason       — why evidence is not yet passed (if applicable)
#   profile_impact        — profiles affected by this finding
#   review_status         — independent review status where required
# ──────────────────────────────────────────────────────────────────────

# ──────────────────────────────────────────────────────────────────────
# Severity legend:
#   critical — memory/handle unsafety, confinement failure, handler
#              invocation despite rejection, false release evidence,
#              detached work after claimed shutdown (externally exploitable)
#   high     — material protocol ambiguity, API contract violation,
#              incorrect lifecycle state
#   medium   — incorrect timeout semantics, silently ignored values,
#              inaccurate metadata, HEAD/validator inconsistencies
#   low      — performance opportunities, documentation cleanup
# ──────────────────────────────────────────────────────────────────────

# ════════════════════════════════════════════════════════════════════════
# Finding COR-001: Windows native string length from UTF-8 bytes
# ════════════════════════════════════════════════════════════════════════
[[finding]]
id = "COR-001"
title = "Windows native string lengths derived from UTF-8 byte counts"
severity = "critical"
subsystem = "filesystem"
affected_profiles = ["windows-reverse-proxy", "windows-direct-https", "windows-functional"]
first_observed = "pre-074"
owning_plan = 76
release = "A"
status = "closed"
closure_commit = "e3782ab"
closure_plan = "084"
regression_evidence = "windows-plan084::windows_unicode_bmp_non_ascii, windows_unicode_surrogate_pair"
implementation_status = "implemented"
evidence_status = "partial"
implementation_sha = "a878b28"
evidence_sha = ""
required_gates = ["windows.unicode-child-production-path"]
blocking_reason = "Windows qualification requires dedicated NTFS environment"
profile_impact = ["windows-reverse-proxy", "windows-direct-https", "windows-functional"]
review_status = "pending"

[finding.description]
text = "UNICODE_STRING call sites use UTF-8 byte counts instead of UTF-16 code unit lengths for component names, causing incorrect buffer sizes for non-ASCII paths."

[finding.reproduction]
strategy = "integration-test"
location = "crates/eggserve-core/tests/windows_plan084.rs"
cases = [
    "windows_unicode_bmp_non_ascii — Latin/Cyrillic/CJK through production resolver",
    "windows_unicode_surrogate_pair — supplementary plane characters",
    "windows_unicode_case_insensitive — case folding through production resolver",
]
platform = "windows"
deterministic = true

[finding.gates_invalidated]
required = ["windows.unicode-child-production-path"]
optional = ["windows.handle-ownership", "windows.reparse-matrix", "windows.namespace-matrix"]

[finding.regression_test]
test_name = "windows_unicode_bmp_non_ascii"
file = "crates/eggserve-core/tests/windows_plan084.rs"
command = "cargo test -p eggserve-core --test windows_plan084 --features windows-plan086 windows_unicode"

