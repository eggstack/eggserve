date_closed = "2025-07-25"
owner = "eggserve"
resolution = "fixed"
resolution_description = "Propagate headers from hyper response to CanonicalResponse builder. Extract body bytes for in-memory responses (errors, small bodies). File-backed responses still use ResponseBody::Empty (the runtime streams them directly)."
affected_components = ["crates/eggserve-core/src/server/static_service.rs"]
production_impact = "None — production profiles use the built-in path, not StaticService::call"
regression_risk = "low"

[finding.implementation]
