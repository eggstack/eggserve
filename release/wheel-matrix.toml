# release/wheel-matrix.toml — canonical wheel-target authority (Plans 265, 268).
#
# This file is the single declarative source for release wheel targets.
# `scripts/wheel-matrix.py` validates it, emits the GitHub Actions build
# matrix, and exposes the required platform tags to
# `scripts/check-release-wheel-set.py`. Do not maintain a second platform
# list in the release workflow or the validator.
#
# Plan 268 Track A: `manylinux` (container/platform compatibility baseline)
# and `compatibility` (maturin `--compatibility` PyPI policy) are separate
# controls. Never pass the string `pypi` through the action's `manylinux:`
# input; `pypi` belongs only in `compatibility` (emitted as
# `--compatibility pypi` in the build args).
#   - Linux glibc: manylinux = "2_17", compatibility = "pypi"
#   - Linux musl: manylinux = "musllinux_1_2", compatibility = "pypi"
#     (portable musl baseline preserved; PyPI policy applied separately)
#   - macOS/Windows: manylinux = "auto" (native platform, ignored on
#     non-Linux by the action), compatibility = "pypi"
#
# Plan 268 Track B: cross-built artifacts must not claim build-host `native`
# smoke. `native` means install-and-execute on the build host itself.
# `deferred-native` means the artifact is built (cross-)containerized but
# execution belongs to the native qualifier job on `qualify_runner`
# (direct install). `deferred-container` means execution belongs to the
# qualifier job inside a native container (AArch64 musl Alpine). A target
# with `qualify_runner` must use a deferred smoke; a deferred smoke must
# name its qualifier.
#
# Tier meanings:
#   required  — must be present in every release aggregate; missing fails.
#   candidate — may be built/smoked experimentally; never counts as supported
#               and never satisfies the aggregate gate on its own.
#   deferred  — recorded blocker; not built by the release workflow.

authority_version = 1

[[target]]
id = "linux-x86_64-glibc"
name = "Linux x86_64 (glibc)"
rust_target = "x86_64-unknown-linux-gnu"
platform_tag = "manylinux_2_17_x86_64"
runner = "ubuntu-latest"
manylinux = "2_17"
compatibility = "pypi"
build = "cross-container"
smoke = "native"
tier = "required"
arch_family = "x86_64"
libc = "glibc"
artifact = "wheel-manylinux-x86_64"
notes = "Representative stable-ABI host; build-once test-many artifact (Plan 264). Same-arch container build, so build-host native smoke is valid."

[[target]]
id = "linux-aarch64-glibc"
name = "Linux AArch64 (glibc)"
rust_target = "aarch64-unknown-linux-gnu"
platform_tag = "manylinux_2_17_aarch64"
runner = "ubuntu-latest"
manylinux = "2_17"
compatibility = "pypi"
build = "cross-container"
smoke = "deferred-native"
tier = "required"
arch_family = "aarch64"
libc = "glibc"
artifact = "wheel-manylinux-aarch64"
qualify_runner = "ubuntu-24.04-arm"
notes = "Cross-built for deterministic packaging; never executed on the x86_64 build host. Execution belongs to qualify-aarch64-glibc on the ARM64 hosted runner (Plan 268). Covers 64-bit Raspberry Pi / Le Potato-class userspaces."

[[target]]
id = "linux-armv7-glibc"
name = "Linux ARMv7 (glibc)"
rust_target = "armv7-unknown-linux-gnueabihf"
platform_tag = "manylinux_2_17_armv7l"
runner = "ubuntu-latest"
manylinux = "2_17"
compatibility = "pypi"
build = "cross-container"
smoke = "qemu"
tier = "required"
arch_family = "armv7"
libc = "glibc"
artifact = "wheel-manylinux-armv7"
qemu_platform = "linux/arm/v7"
qemu_image = "arm32v7/python:3.11-bookworm"
notes = "Executed under a matching ARMv7 glibc userspace via QEMU; never proven by AArch64 compat mode alone."

[[target]]
id = "linux-x86_64-musl"
name = "Linux x86_64 (musl)"
rust_target = "x86_64-unknown-linux-musl"
platform_tag = "musllinux_1_2_x86_64"
runner = "ubuntu-latest"
manylinux = "musllinux_1_2"
compatibility = "pypi"
build = "cross-container"
smoke = "post-publish-only"
tier = "required"
arch_family = "x86_64"
libc = "musl"
artifact = "wheel-musllinux-x86_64"
notes = "Pre-publish composition gate only; runtime proof is the Alpine post-publication smoke."

[[target]]
id = "linux-aarch64-musl"
name = "Linux AArch64 (musl)"
rust_target = "aarch64-unknown-linux-musl"
platform_tag = "musllinux_1_2_aarch64"
runner = "ubuntu-latest"
manylinux = "musllinux_1_2"
compatibility = "pypi"
build = "cross-container"
smoke = "deferred-container"
tier = "required"
arch_family = "aarch64"
libc = "musl"
artifact = "wheel-musllinux-aarch64"
qualify_runner = "ubuntu-24.04-arm"
notes = "Cross-built; never installed on the glibc build host. Pre-publish execution belongs to qualify-aarch64-musl in a native ARM64 Alpine container (Plan 268); post-publication Alpine smoke retained."

[[target]]
id = "linux-armv7-musl"
name = "Linux ARMv7 (musl)"
rust_target = "armv7-unknown-linux-musleabihf"
platform_tag = "musllinux_1_2_armv7l"
runner = "ubuntu-latest"
manylinux = "musllinux_1_2"
compatibility = "pypi"
build = "cross-container"
smoke = "qemu"
tier = "required"
arch_family = "armv7"
libc = "musl"
artifact = "wheel-musllinux-armv7"
qemu_platform = "linux/arm/v7"
qemu_image = "arm32v7/python:3.11-alpine"
notes = "Added by Plan 265. Rust/maturin target spelling confirmed against the pinned toolchain: armv7-unknown-linux-musleabihf. Executed under a matching ARMv7 musl userspace via QEMU with sh (no bash in minimal Alpine)."

[[target]]
id = "macos-x86_64"
name = "macOS x86_64"
rust_target = "x86_64-apple-darwin"
platform_tag = "macosx_11_0_x86_64"
runner = "macos-15-intel"
manylinux = "auto"
compatibility = "pypi"
build = "native"
smoke = "native"
tier = "required"
arch_family = "x86_64"
libc = "darwin"
artifact = "wheel-macos-x86_64"
notes = "Deployment tag is matrix policy (11_0); docs and validator derive from this file. Native baseline (auto, ignored on non-Linux); PyPI policy enforced separately."

[[target]]
id = "macos-arm64"
name = "macOS arm64"
rust_target = "aarch64-apple-darwin"
platform_tag = "macosx_11_0_arm64"
runner = "macos-14"
manylinux = "auto"
compatibility = "pypi"
build = "native"
smoke = "native"
tier = "required"
arch_family = "arm64"
libc = "darwin"
artifact = "wheel-macos-arm64"
notes = "Native hosted runner build and smoke. Native baseline (auto); PyPI policy enforced separately."

[[target]]
id = "windows-x86_64"
name = "Windows x86_64"
rust_target = "x86_64-pc-windows-msvc"
platform_tag = "win_amd64"
runner = "windows-latest"
manylinux = "auto"
compatibility = "pypi"
build = "native"
smoke = "native"
tier = "required"
arch_family = "x86_64"
libc = "msvc"
artifact = "wheel-windows-x86_64"
notes = "Native hosted runner build and smoke. Native baseline (auto); PyPI policy enforced separately."

[[target]]
id = "windows-arm64"
name = "Windows ARM64"
rust_target = "aarch64-pc-windows-msvc"
platform_tag = "win_arm64"
runner = "windows-latest"
manylinux = "auto"
compatibility = "pypi"
build = "cross-container"
smoke = "deferred-native"
tier = "required"
arch_family = "arm64"
libc = "msvc"
artifact = "wheel-windows-arm64"
qualify_runner = "windows-11-arm"
notes = "Cross-built artifact; never executed on the x86_64 Windows build host. Execution belongs to qualify-windows-arm64 on the native Windows ARM64 runner (Plan 268, required gate). Support remains functional (trusted/local-content only)."

