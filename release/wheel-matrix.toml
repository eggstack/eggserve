# release/wheel-matrix.toml — canonical wheel-target authority (Plan 265).
#
# This file is the single declarative source for release wheel targets.
# `scripts/wheel-matrix.py` validates it, emits the GitHub Actions build
# matrix, and exposes the required platform tags to
# `scripts/check-release-wheel-set.py`. Do not maintain a second platform
# list in the release workflow or the validator.
#
# Tier meanings:
#   required  — must be present in every release aggregate; missing fails.
#   candidate — may be built/smoked experimentally; never counts as supported
#               and never satisfies the aggregate gate on its own.
#   deferred  — recorded blocker; not built by the release workflow.

authority_version = 1

[[target]]
id = "linux-x86_64-glibc"
name = "Linux x86_64 (glibc)"
rust_target = "x86_64-unknown-linux-gnu"
platform_tag = "manylinux_2_17_x86_64"
runner = "ubuntu-latest"
maturin_compat = "pypi"
build = "cross-container"
smoke = "native"
tier = "required"
arch_family = "x86_64"
libc = "glibc"
artifact = "wheel-manylinux-x86_64"
notes = "Representative stable-ABI host; build-once test-many artifact (Plan 264)."

[[target]]
id = "linux-aarch64-glibc"
name = "Linux AArch64 (glibc)"
rust_target = "aarch64-unknown-linux-gnu"
platform_tag = "manylinux_2_17_aarch64"
runner = "ubuntu-latest"
maturin_compat = "pypi"
build = "cross-container"
smoke = "native"
tier = "required"
arch_family = "aarch64"
libc = "glibc"
artifact = "wheel-manylinux-aarch64"
qualify_runner = "ubuntu-24.04-arm"
notes = "Cross-built for deterministic packaging; executed natively on the ARM64 hosted runner (Plan 266 option 2). Covers 64-bit Raspberry Pi / Le Potato-class userspaces."

[[target]]
id = "linux-armv7-glibc"
name = "Linux ARMv7 (glibc)"
rust_target = "armv7-unknown-linux-gnueabihf"
platform_tag = "manylinux_2_17_armv7l"
runner = "ubuntu-latest"
maturin_compat = "pypi"
build = "cross-container"
smoke = "qemu"
tier = "required"
arch_family = "armv7"
libc = "glibc"
artifact = "wheel-manylinux-armv7"
qemu_platform = "linux/arm/v7"
qemu_image = "arm32v7/python:3.11-bookworm"
notes = "Executed under a matching ARMv7 glibc userspace via QEMU; never proven by AArch64 compat mode alone."

[[target]]
id = "linux-x86_64-musl"
