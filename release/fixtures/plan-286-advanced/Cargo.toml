[package]
name = "plan-286-advanced-consumer"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
eggserve-primitives = "=0.2.1"
eggserve-server = "=0.3.0"
tokio = { version = "1", features = ["macros", "net", "time", "io-util", "fs", "sync", "rt", "rt-multi-thread"] }

[dev-dependencies]
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring"] }
