[package]
name = "plan-286-tower-consumer"
version = "0.0.0"
edition = "2021"
publish = false

[features]
tower = []

[dependencies]
eggserve-primitives = "=0.2.1"
eggserve-server = { version = "=0.3.0", default-features = false, features = ["tower"] }
tokio = { version = "1", features = ["macros", "net", "time", "io-util", "sync", "rt", "rt-multi-thread"] }
axum = { version = "0.8", default-features = false }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
tower-layer = "0.3"
tower-service = "0.3"

[workspace]
