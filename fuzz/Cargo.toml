[workspace]

[package]
name = "eggserve-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `rt-multi-thread` is required by `tokio::runtime::Runtime::new()`, which the
# `fuzz_request_body` target drives. The feature pulls in no new package: the
# multi-thread scheduler is part of `tokio` itself.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
bytes = "1"
futures-util = "0.3"

[dependencies.eggserve-core]
path = "../crates/eggserve-core"

# Plan 219: path-confinement fuzz targets drive the single static authority.
[dependencies.eggserve-static]
path = "../crates/eggserve-static"

[[bin]]
name = "request_target"
path = "fuzz_targets/request_target.rs"
test = false
doc = false

[[bin]]
name = "percent_decode"
path = "fuzz_targets/percent_decode.rs"
test = false
doc = false

[[bin]]
name = "path_components"
path = "fuzz_targets/path_components.rs"
test = false
doc = false

[[bin]]
name = "range_header"
path = "fuzz_targets/range_header.rs"
test = false
doc = false

[[bin]]
name = "if_none_match"
path = "fuzz_targets/if_none_match.rs"
test = false
doc = false

[[bin]]
name = "platform_component"
path = "fuzz_targets/platform_component.rs"
test = false
doc = false

[[bin]]
name = "validate_method"
path = "fuzz_targets/validate_method.rs"
test = false
doc = false

[[bin]]
name = "fuzz_header_block"
path = "fuzz_targets/fuzz_header_block.rs"
test = false
