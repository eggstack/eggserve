[package]
name = "eggserve-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Security policy, path confinement, and static-serving primitives for eggserve"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "docs/**",
    "architecture/**",
    "python-examples/*.py",
    "python-examples/README.md",
    "LICENSE",
]

[lints]
workspace = true

[features]
default = []
http2 = ["hyper/http2", "hyper-util/http2", "eggnet-tls?/http2"]
tls = ["dep:eggnet-tls", "dep:rustls", "dep:tokio-rustls"]
http3 = ["tls", "dep:h3", "dep:h3-quinn", "dep:quinn"]
http-interop = ["dep:http"]
tower = ["http-interop", "dep:tower-service", "dep:tower-layer"]
python-bindings-internal = []
windows-adversarial-qualification = []

[dependencies]
eggnet-tls = { path = "../eggnet-tls", version = "0.1.2", optional = true, default-features = false }
eggserve-primitives = { path = "../eggserve-primitives", version = "0.1.2" }
eggserve-server = { path = "../eggserve-server", version = "0.1.2" }
eggserve-static = { path = "../eggserve-static", version = "0.1.2" }
bytes = "1"
futures-util = "0.3"
http = { version = "1", optional = true }
tower-service = { version = "0.3", optional = true }
tower-layer = { version = "0.3", optional = true }
# Direct use: TrackedBody implements http_body::Body to observe response-body
# completion for the write-no-progress timeout (Plan 164). Already in the
# tree via hyper; pinned directly so the impl does not rely on transitive
# re-exports.
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
phf = { version = "0.11", features = ["macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "signal", "time", "fs", "io-util", "sync"] }

# TLS dependencies (feature-gated)
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring"] }

# HTTP/3/QUIC transport (Plan 187). Kept out of the default and HTTP/1/H2
# graphs; the adapter types remain internal to the experimental server.
h3 = { version = "0.0.8", optional = true, default-features = false }
h3-quinn = { version = "0.0.10", optional = true, default-features = false }
quinn = { version = "0.11.11", optional = true, default-features = false, features = ["runtime-tokio", "rustls-ring"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "net"] }

[dev-dependencies]
hyper = { version = "1", features = ["client", "http2"] }
libc = "0.2"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rcgen = "0.13"
tokio = { version = "1", features = ["rt-multi-thread"] }
rustls-pki-types = "1"
tokio-rustls = "0.26"
# Plan 199 Track I: dev-only WebSocket interop fixture proving the generic
# tunnel handoff is sufficient for a downstream codec. Production core has no
# WebSocket framing/dependency; this stays in tests only.
tokio-tungstenite = "0.26"
