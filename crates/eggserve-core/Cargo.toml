[package]
name = "eggserve-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Security policy, path confinement, and static-serving primitives for eggserve"
repository = "https://github.com/eggstack/eggserve"
homepage = "https://github.com/eggstack/eggserve"
readme = "../../README.md"

[features]
default = []
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile"]
python-bindings-internal = []
windows-adversarial-qualification = []

[dependencies]
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
phf = { version = "0.11", features = ["macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "signal", "time", "fs", "io-util", "sync"] }

# TLS dependencies (feature-gated)
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
hyper = { version = "1", features = ["client"] }
libc = "0.2"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rcgen = "0.13"
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-rustls = "0.26"
rustls-pki-types = "1"
