[package]
name = "eggserve-core"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Compatibility and composition layer for EggServe's direct primitives, runtime, static-serving, TLS, and optional protocol adapters"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "docs/**",
    "architecture/**",
    "python-examples/*.py",
    "python-examples/README.md",
    "LICENSE",
]

[lints]
workspace = true

[package.metadata.docs.rs]
# Render the full compatibility surface on docs.rs. The internal
# `python-bindings-internal` bridge and the Windows qualification marker stay
# off so the published docs show the supported surface only.
features = ["http2", "http3", "tls", "http-interop", "tower"]

[features]
default = []
http2 = ["hyper/http2", "hyper-util/http2", "eggnet-tls?/http2"]
tls = ["dep:eggnet-tls", "dep:rustls", "dep:tokio-rustls"]
http3 = ["tls", "dep:eggserve-h3"]
http-interop = ["eggserve-server/http-interop"]
tower = ["http-interop", "eggserve-server/tower"]
# Plan 219: the `ResolvedFile` capability bridge (`from_parts`/`into_parts`/
# `into_std_file`) is owned by the static authority. This feature forwards to
# `eggserve-static/python-bindings-internal` so the Python bindings keep a
# single bridge without a second filesystem implementation.
python-bindings-internal = ["eggserve-static/python-bindings-internal"]
windows-adversarial-qualification = []

[dependencies]
eggnet-tls = { path = "../eggnet-tls", version = "0.2.0", optional = true, default-features = false }
eggserve-primitives = { path = "../eggserve-primitives", version = "0.2.3" }
eggserve-server = { path = "../eggserve-server", version = "0.5.0" }
eggserve-static = { path = "../eggserve-static", version = "0.5.0" }
eggserve-h3 = { path = "../eggserve-h3", version = "0.5.0", optional = true }
bytes = { workspace = true }
futures-util = { workspace = true }
# Direct use: TrackedBody implements http_body::Body to observe response-body
# completion for the write-no-progress timeout (Plan 164). Already in the
# tree via hyper; pinned directly so the impl does not rely on transitive
# re-exports.
http-body = { workspace = true }
http-body-util = { workspace = true }
httpdate = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio", "server", "http1"] }
thiserror = "2"
tokio = { workspace = true, features = ["macros", "net", "signal", "time", "fs", "io-util", "sync"] }

# TLS dependencies (feature-gated)
# The rustls security floor (Plan 218, RUSTSEC-2026-0285) is declared once in
# the root `[workspace.dependencies]` table and inherited here.
rustls = { workspace = true, optional = true, default-features = false, features = ["std", "ring"] }
tokio-rustls = { workspace = true, optional = true, features = ["ring"] }

[target.'cfg(unix)'.dependencies]
# Plan 219: the static confinement implementation (and its `rustix::fs` use)
# lives once in `eggserve-static`. Core keeps `rustix` only for listener
# accept/socket validation (`rustix::net`). The descriptor-exhaustion
# predicate moved to `eggserve_server::accept_error` (Plan 309), so core no
# longer needs `rustix::io::Errno`.
rustix = { workspace = true, features = ["net"] }

[dev-dependencies]
hyper = { workspace = true, features = ["client", "http2"] }
libc = { workspace = true }
proptest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { workspace = true }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
rustls-pki-types = { workspace = true }
tokio-rustls = { workspace = true, default-features = true }
# Plan 199 Track I: dev-only WebSocket interop fixture proving the generic
# tunnel handoff is sufficient for a downstream codec. Production core has no
# WebSocket framing/dependency; this stays in tests only.
tokio-tungstenite = "0.26"
http = "1"
tower-service = "0.3"
