[package]
name = "eggserve-server"
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Generic EggServe HTTP runtime and service authority"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Accepted compatibility names. The direct crate is H1-only; H2/TLS
# orchestration remains in eggserve-core, so these features are inert.
http2 = []
tls = []
http-interop = ["dep:http", "eggserve-primitives/http-interop"]
# Plan 296: production adapter code drives Tower services (poll_ready/call)
# but never implements the Layer contract itself, so the `tower` feature no
# longer activates `tower-layer`. The optional dependency stays declared
# (topology-gated Plan-276 surface); tests use it via dev-dependencies, and
# downstream Layer authors depend on `tower-layer` directly.
tower = ["http-interop", "dep:tower-service"]

[dependencies]
eggserve-primitives = { path = "../eggserve-primitives", version = "0.2.2" }
bytes = "1"
futures-util = "0.3"
http-body = "1"
http-body-util = "0.1"
http = { version = "1", optional = true }
tower-service = { version = "0.3", optional = true }
tower-layer = { version = "0.3", optional = true }
httpdate = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
tokio = { version = "1", features = ["macros", "net", "time", "io-util", "fs", "sync", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
tower-layer = "0.3"
axum = { version = "0.8", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = "0.13"
