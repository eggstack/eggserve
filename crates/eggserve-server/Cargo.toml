[package]
name = "eggserve-server"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Generic EggServe HTTP runtime and service authority"
keywords = ["http", "http-server", "server", "runtime", "hyper"]
categories = ["web-programming::http-server", "network-programming"]
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
# Render the Tower/HTTP-interop adapter surface on docs.rs; the default
# feature set is empty for this direct H1 crate.
features = ["http-interop", "tower"]

[features]
default = []
# Accepted compatibility names. The direct crate is H1-only; H2/TLS
# orchestration remains in eggserve-core, so these features are inert.
http2 = []
tls = []
http-interop = ["dep:http", "eggserve-primitives/http-interop"]
# Plan 296: production adapter code drives Tower services (poll_ready/call)
# but never implements the Layer contract itself, so the `tower` feature no
# longer activates `tower-layer`. The optional dependency stays declared
# (topology-gated Plan-276 surface); tests use it via dev-dependencies, and
# downstream Layer authors depend on `tower-layer` directly.
tower = ["http-interop", "dep:tower-service"]

[dependencies]
eggserve-primitives = { path = "../eggserve-primitives", version = "0.2.3" }
bytes = { workspace = true }
futures-util = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
http = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
tower-layer = { workspace = true, optional = true }
httpdate = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio", "server", "http1"] }
tokio = { workspace = true, features = ["macros", "net", "time", "io-util", "fs", "sync", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
tower-layer = { workspace = true }
axum = { version = "0.8", default-features = false }
# The rustls security floor (Plan 218, RUSTSEC-2026-0285) is declared once in
# the root `[workspace.dependencies]` table and inherited here.
rustls = { workspace = true, default-features = false, features = ["std", "ring"] }
tokio-rustls = { workspace = true, features = ["ring"] }
rcgen = { workspace = true }
