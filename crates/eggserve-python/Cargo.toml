[package]
name = "eggserve-python"
version = "0.2.3"
edition = "2021"
license = "MIT"
description = "Python native bindings for eggserve hardened primitives"

[lints]
[lints.rust]
unsafe_code = "deny"

[lib]
name = "_native"
crate-type = ["cdylib"]

# Maturin builds this excluded crate independently from the workspace. Keep
# its distribution profile explicit and equivalent to the workspace profile.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"

[dependencies]
# Explicit versions alongside paths so cargo-deny wildcards=deny passes
# (Plan 218); versions track the workspace package version.
# Plan 221: the PyO3 bridge names the canonical leaf crates directly for
# neutral policy/primitives (policy, request/response/body/lifecycle),
# the generic runtime (ops, response policy, service, shared limits), the
# static authority (SecureRoot/planner capability bridge), and the neutral
# TLS substrate. The compatibility core remains for the extended server
# orchestration (Server/ServerHandle/RuntimeConfig with TLS, lifecycle,
# ServeConfig/static orchestration, static listing budgets) and the
# extension-backed CLI (`eggserve-bin::run_cli`, confirmed used) until
# Plan 225 closes the facade.
eggserve-core = { path = "../eggserve-core", version = "0.3.0", features = ["tls", "python-bindings-internal"] }
eggserve-bin = { path = "../eggserve-bin", version = "0.2.0", features = ["tls"] }
eggserve-primitives = { path = "../eggserve-primitives", version = "0.2.1" }
eggserve-server = { path = "../eggserve-server", version = "0.3.0" }
eggserve-static = { path = "../eggserve-static", version = "0.3.0", features = ["python-bindings-internal"] }
eggnet-tls = { path = "../eggnet-tls", version = "0.2.0" }
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py311", "generate-import-lib"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time"] }
# Security floor (Plan 218, RUSTSEC-2026-0285): caret floor keeps Cargo from
# resolving below the patched 0.23.45 line. This manifest has its own lockfile.
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# Bounded Python iterator -> Rust stream bridge (Plan 166): chunk bytes and
# Stream impl for the mpsc-backed producer. Already in the workspace tree via
# eggserve-core; pinned directly so the bridge does not rely on transitive re-exports.
bytes = "1"
futures-util = "0.3"
