[package]
name = "eggserve-python"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Python native bindings for eggserve hardened primitives"

[lib]
name = "_native"
crate-type = ["cdylib"]

# Maturin builds this excluded crate independently from the workspace. Keep
# its distribution profile explicit and equivalent to the workspace profile.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"

[dependencies]
eggserve-core = { path = "../eggserve-core", features = ["tls", "python-bindings-internal"] }
eggserve-bin = { path = "../eggserve-bin", features = ["tls"] }
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py311", "generate-import-lib"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
