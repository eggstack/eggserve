[package]
name = "eggserve-h3"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Experimental EggServe HTTP/3 and QUIC transport adapter"
keywords = ["http3", "quic", "h3", "eggserve"]
categories = ["web-programming::http-server", "network-programming"]
rust-version.workspace = true
readme = "../../README.md"
include = ["src/**", "tests/**", "LICENSE"]

[lints]
workspace = true

[features]
default = []

[dependencies]
# Keep this compatibility set together. These are intentionally direct here,
# rather than in eggserve-core or eggserve-server, so disabling H3 removes the
# QUIC stack from the ordinary server package graph.
h3 = { version = "0.0.8", default-features = false }
h3-quinn = { version = "0.0.10", default-features = false }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
# Plan 220: the H3 adapter owns endpoint/connection/request/response/tunnel
# mechanics over the canonical primitives/server layers. Downward-only:
# primitives <- server <- h3; server never depends upward on H3.
eggserve-primitives = { path = "../eggserve-primitives", version = "0.2.3" }
eggserve-server = { path = "../eggserve-server", version = "0.5.0" }
eggnet-tls = { path = "../eggnet-tls", version = "0.2.0", default-features = false }
# QUIC TLS assembly is H3-owned (TLS 1.3, h3 ALPN, no 0-RTT); reusable
# identity parsing stays in eggnet-tls. The rustls security floor
# (Plan 218, RUSTSEC-2026-0285) is declared once in the root
# `[workspace.dependencies]` table and inherited here.
rustls = { workspace = true, default-features = false, features = ["std", "ring"] }
bytes = { workspace = true }
futures-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
tokio = { workspace = true, features = ["macros", "net", "time", "io-util", "sync", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
tempfile = { workspace = true }
rcgen = { workspace = true }
