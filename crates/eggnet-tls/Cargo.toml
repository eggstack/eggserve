[package]
name = "eggnet-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Neutral rustls server identity, client-auth, trust, and reload configuration"
keywords = ["tls", "rustls", "mtls", "sni", "security"]
categories = ["network-programming", "authentication"]
rust-version.workspace = true
readme = "../../README.md"
include = ["src/**", "tests/**", "LICENSE"]

[lints]
workspace = true

[features]
default = []
http2 = []

[dependencies]
# The rustls security floor (Plan 218, RUSTSEC-2026-0285) is declared once in
# the root `[workspace.dependencies]` table and inherited here.
rustls = { workspace = true, default-features = false, features = ["std", "ring"] }
rustls-pki-types = { workspace = true, features = ["std"] }

[dev-dependencies]
rcgen = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
tokio-rustls = { workspace = true, default-features = true }
