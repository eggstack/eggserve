[package]
name = "eggserve-static"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Hardened static-file specialization for the EggServe runtime"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
python-bindings-internal = []

[dependencies]
eggserve-primitives = { path = "../eggserve-primitives", version = "0.1.2" }
eggserve-server = { path = "../eggserve-server", version = "0.1.2" }
httpdate = "1"
phf = { version = "0.11", features = ["macros"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "net"] }

[dev-dependencies]
libc = "0.2"
proptest = "1"
tempfile = "3"
