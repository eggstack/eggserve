[package]
name = "eggserve-static"
version = "0.5.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Hardened static-file service and filesystem confinement authority for the EggServe runtime"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
python-bindings-internal = []

[dependencies]
eggserve-primitives = { path = "../eggserve-primitives", version = "0.2.3" }
eggserve-server = { path = "../eggserve-server", version = "0.5.0" }
httpdate = { workspace = true }
phf = { version = "0.11", features = ["macros"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "net"] }

[dev-dependencies]
libc = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
