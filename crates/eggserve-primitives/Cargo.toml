[package]
name = "eggserve-primitives"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Canonical transport-neutral HTTP request, response, and policy values for EggServe"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Accepted compatibility name; HTTP interop remains core-owned and this
# transport-neutral crate intentionally pulls no HTTP dependency.
http-interop = []

[dependencies]
bytes = "1"
futures-util = "0.3"

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "sync"] }
