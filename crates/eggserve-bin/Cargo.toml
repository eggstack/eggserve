[package]
name = "eggserve-bin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "CLI binary for eggserve hardened static file server"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
name = "eggserve_bin"
path = "src/lib.rs"

[[bin]]
name = "eggserve"
path = "src/main.rs"

[features]
default = []
tls = ["eggserve-core/tls"]

[dependencies]
eggserve-core = { path = "../eggserve-core", version = "0.1.2" }
tokio = { version = "1", features = ["macros", "net", "signal", "time", "sync"] }

[dev-dependencies]
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
