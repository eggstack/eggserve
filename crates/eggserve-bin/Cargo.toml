[package]
name = "eggserve-bin"
version = "0.2.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "CLI binary for eggserve hardened static file server"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "eggserve_bin"
path = "src/lib.rs"

[[bin]]
name = "eggserve"
path = "src/main.rs"

[features]
default = []
http2 = ["eggserve-core/http2"]
tls = ["eggserve-core/tls"]
http3 = ["eggserve-core/http3", "dep:eggserve-h3", "tls"]

[dependencies]
eggserve-core = { path = "../eggserve-core", version = "0.4.0" }
eggserve-h3 = { path = "../eggserve-h3", version = "0.4.0", optional = true }
# Plan 221: first-party frontend consumes the canonical leaf crates directly.
# Neutral policy/primitives (policy, static metadata types), the generic H1
# runtime (ops, shared limits, service), the static authority (path/secure
# root/planner used by tests), and the neutral TLS substrate are named
# explicitly. The compatibility core remains for the extended server
# orchestration (serve_config/try_from_serve_config, full Server with
# TLS/H2/H3, full StaticService with extra headers/error policy, and
# ServeConfig/Limits static budgets) until Plan 225 closes the facade.
eggserve-primitives = { path = "../eggserve-primitives", version = "0.2.2" }
eggserve-server = { path = "../eggserve-server", version = "0.4.0" }
eggserve-static = { path = "../eggserve-static", version = "0.4.0" }
eggnet-tls = { path = "../eggnet-tls", version = "0.2.0" }
tokio = { version = "1", features = ["macros", "net", "signal", "time", "sync"] }

[dev-dependencies]
tempfile = "3"
# Security floor (Plan 218, RUSTSEC-2026-0285): caret floor keeps Cargo from
# resolving below the patched 0.23.45 line.
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring"] }
tokio-rustls = "0.26"
rustls-pki-types = "1"
