[package]
name = "eggserve-bin"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CLI binary for eggserve"
repository = "https://github.com/eggstack/eggserve"
homepage = "https://github.com/eggstack/eggserve"
readme = "../../README.md"

[lib]
name = "eggserve_bin"
path = "src/lib.rs"

[[bin]]
name = "eggserve"
path = "src/main.rs"

[features]
default = []
tls = ["eggserve-core/tls"]

[dependencies]
eggserve-core = { path = "../eggserve-core", version = "0.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
