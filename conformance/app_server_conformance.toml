# Plan 207 — Cross-Protocol Application-Server Conformance Inventory
#
# Normative semantic scenario inventory (Track A) with transport (Track B)
# and consumer (Track C) applicability. One scenario is defined once here;
# qualification runs it through every applicable transport/consumer.
#
# Vocabulary:
#   transports: h1_tcp | h1_tls | h1_prebound | h1_unix | h2_prior | h2_tls |
#               h2_prebound | h3_quic | caller_owned
#   consumers:  native | http_interop | tower | async_python | asgi_fixture
#   routine:    true  -> deterministic Linux subset in routine CI
#               false -> manual/release evidence (expensive, external tooling,
#                        browsers, soak, impairment, cross-platform)
#
# Capability-gated skips are explicit (`skip_reason`), never silent.
# H3 over Unix stream is impossible by construction and never listed.
# Python consumers are H1-only by product contract; H2/H3 never list them.

[meta]
version = 1
plan = 207

