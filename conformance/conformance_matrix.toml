# Plan 083 Track B — Unified Canonical Conformance Matrix
#
# Single source of truth for expected behavior across all supported dimensions.
# Each entry defines expected status, headers, body behavior, and connection policy.
#
# Dimensions:
#   resource: direct_file | directory_index | root_index | directory_listing | missing | denied
#   method: GET | HEAD
#   conditional: none | etag_match | etag_mismatch | ims_match | ims_mismatch | both_match | weak_etag
#   range: none | exact | open_ended | suffix | unsatisfiable | malformed | if_range_match | if_range_mismatch
#   file_state: normal | empty
#   http_version: 1.0 | 1.1
#   connection: close | keep_alive

[global]
file_size = 11          # "hello world" = 11 bytes
empty_file_size = 0
index_size = 15         # "<html>hi</html>" = 15 bytes

# ===========================================================================
# Direct file — GET
# ===========================================================================

[[matrix]]
resource = "direct_file"
method = "GET"
conditional = "none"
range = "none"
file_state = "normal"
http_version = "1.1"
connection = "close"
expected_status = 200
expected_content_length = 11
expected_content_type = "text/plain"
body_forbidden = false
connection_reuse = false

[[matrix]]
resource = "direct_file"
method = "GET"
conditional = "etag_match"
range = "none"
file_state = "normal"
http_version = "1.1"
connection = "close"
