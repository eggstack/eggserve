name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHON: "3.14"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Build wheel (Linux x86_64)"
            os: ubuntu-latest
            artifact: wheel-linux-x86_64
            maturin_flags: "--auditwheel repair"
            venv_python: /tmp/smoke-venv/bin/python
            console_script: /tmp/smoke-venv/bin/eggserve
          - name: "Build wheel (macOS arm64)"
            os: macos-14
            artifact: wheel-macos-arm64
            maturin_flags: ""
            venv_python: /tmp/smoke-venv/bin/python
            console_script: /tmp/smoke-venv/bin/eggserve
          - name: "Build wheel (Windows x86_64)"
            os: windows-latest
            artifact: wheel-windows-x86_64
            maturin_flags: ""
            venv_python: /tmp/smoke-venv/Scripts/python
            console_script: /tmp/smoke-venv/Scripts/eggserve.exe
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON }}
      - name: Install Maturin
        run: python -m pip install maturin==1.14.1
      - name: Build wheel
        shell: bash
        run: |
          cd crates/eggserve-python
          python -m maturin build --profile dist \
            --interpreter python${{ env.PYTHON }} \
            ${{ matrix.maturin_flags }} \
            --out "$GITHUB_WORKSPACE/dist"
      - name: Verify wheel composition
        shell: bash
        run: |
          python "$GITHUB_WORKSPACE/scripts/check-wheel-composition.py" dist
      - name: Smoke test wheel
        shell: bash
        run: |
          python -m venv /tmp/smoke-venv
          ${{ matrix.venv_python }} -m pip install --disable-pip-version-check -q dist/*.whl

          # Verify both supported entry forms
          ${{ matrix.console_script }} --help >/dev/null
          echo "  eggserve --help OK"
          ${{ matrix.venv_python }} -m eggserve --help >/dev/null
          echo "  python -m eggserve --help OK"

          # Serve a real fixture from the installed wheel (no source-tree/Cargo binary on PATH)
          ${{ matrix.venv_python }} "$GITHUB_WORKSPACE/scripts/release_smoke.py"
      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
