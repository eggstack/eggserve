name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHON: "3.14"

jobs:
  build-linux:
    name: "Build wheel (Linux x86_64)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON }}
      - name: Install Maturin
        run: python -m pip install maturin==1.14.1
      - name: Build wheel
        run: |
          cd crates/eggserve-python
          python -m maturin build --profile dist \
            --interpreter python${{ env.PYTHON }} \
            --auditwheel repair \
            --out "$GITHUB_WORKSPACE/dist"
      - name: Verify wheel composition
        run: |
          python - <<'PYEOF'
          import sys
          import zipfile

          for wheel in sorted(__import__("pathlib").Path("dist").glob("*.whl")):
              with zipfile.ZipFile(wheel) as zf:
                  names = zf.namelist()
                  forbidden = [n for n in names if n.startswith("eggserve/bin/eggserve")]
                  if forbidden:
                      print(f"FAIL: {wheel.name} contains bundled executable: {forbidden}", file=sys.stderr)
                      sys.exit(1)
                  print(f"  {wheel.name}: no bundled server executable (good)")
          PYEOF
      - name: Smoke test wheel
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/python -m pip install --disable-pip-version-check -q dist/*.whl

          # Verify both supported entry forms
          /tmp/smoke-venv/bin/eggserve --help >/dev/null
          echo "  eggserve --help OK"
          /tmp/smoke-venv/bin/python -m eggserve --help >/dev/null
          echo "  python -m eggserve --help OK"

          # Serve a real fixture from the installed wheel (no source-tree/Cargo binary on PATH)
          /tmp/smoke-venv/bin/python -c "import sys; sys.exit(sys.modules['eggserve'].__name__ == 'eggserve' and 0 or 1)"
          /tmp/smoke-venv/bin/python "$GITHUB_WORKSPACE/scripts/release_smoke.py"
      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl

  build-macos:
    name: "Build wheel (macOS arm64)"
    runs-on: macos-14
    timeout-minutes: 30
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON }}
      - name: Install Maturin
        run: python -m pip install maturin==1.14.1
      - name: Build wheel
        run: |
          cd crates/eggserve-python
          python -m maturin build --profile dist \
            --interpreter python${{ env.PYTHON }} \
            --out "$GITHUB_WORKSPACE/dist"
      - name: Verify wheel composition
        run: |
          python - <<'PYEOF'
          import sys
          import zipfile

          for wheel in sorted(__import__("pathlib").Path("dist").glob("*.whl")):
              with zipfile.ZipFile(wheel) as zf:
                  names = zf.namelist()
                  forbidden = [n for n in names if n.startswith("eggserve/bin/eggserve")]
                  if forbidden:
                      print(f"FAIL: {wheel.name} contains bundled executable: {forbidden}", file=sys.stderr)
                      sys.exit(1)
                  print(f"  {wheel.name}: no bundled server executable (good)")
          PYEOF
      - name: Smoke test wheel
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/python -m pip install --disable-pip-version-check -q dist/*.whl

          # Verify both supported entry forms
          /tmp/smoke-venv/bin/eggserve --help >/dev/null
          echo "  eggserve --help OK"
          /tmp/smoke-venv/bin/python -m eggserve --help >/dev/null
          echo "  python -m eggserve --help OK"

          # Serve a real fixture from the installed wheel (no source-tree/Cargo binary on PATH)
          /tmp/smoke-venv/bin/python "$GITHUB_WORKSPACE/scripts/release_smoke.py"
      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-macos-arm64
          path: dist/*.whl

  build-windows:
    name: "Build wheel (Windows x86_64)"
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON }}
      - name: Install Maturin
        run: python -m pip install maturin==1.14.1
      - name: Build wheel
        shell: bash
        run: |
          cd crates/eggserve-python
          python -m maturin build --profile dist \
            --interpreter python${{ env.PYTHON }} \
            --out "$GITHUB_WORKSPACE/dist"
      - name: Verify wheel composition
        shell: bash
        run: |
          python - <<'PYEOF'
          import sys
          import zipfile

          for wheel in sorted(__import__("pathlib").Path("dist").glob("*.whl")):
              with zipfile.ZipFile(wheel) as zf:
                  names = zf.namelist()
                  forbidden = [n for n in names if n.startswith("eggserve/bin/eggserve")]
                  if forbidden:
                      print(f"FAIL: {wheel.name} contains bundled executable: {forbidden}", file=sys.stderr)
                      sys.exit(1)
                  print(f"  {wheel.name}: no bundled server executable (good)")
          PYEOF
      - name: Smoke test wheel
        shell: bash
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/Scripts/python -m pip install --disable-pip-version-check -q dist/*.whl

          # Verify both supported entry forms
          /tmp/smoke-venv/Scripts/eggserve.exe --help >/dev/null
          echo "  eggserve.exe --help OK"
          /tmp/smoke-venv/Scripts/python -m eggserve --help >/dev/null
          echo "  python -m eggserve --help OK"

          # Serve a real fixture from the installed wheel (no source-tree/Cargo binary on PATH)
          /tmp/smoke-venv/Scripts/python "$GITHUB_WORKSPACE/scripts/release_smoke.py"
      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-windows-x86_64
          path: dist/*.whl
