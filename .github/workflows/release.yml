name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHON: "3.14"

jobs:
  build-linux:
    name: "Build wheel (Linux x86_64)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON }}
      - name: Install Maturin
        run: python -m pip install maturin==1.14.1
      - name: Build distribution binary
        run: cargo build --profile dist --locked -p eggserve-bin
      - name: Stage binary into package
        run: |
          mkdir -p crates/eggserve-python/python/eggserve/bin
          cp target/dist/eggserve crates/eggserve-python/python/eggserve/bin/eggserve
          chmod +x crates/eggserve-python/python/eggserve/bin/eggserve
      - name: Build wheel
        run: |
          cd crates/eggserve-python
          python -m maturin build --release \
            --interpreter python${{ env.PYTHON }} \
            --auditwheel repair \
            --out "$GITHUB_WORKSPACE/dist"
      - name: Smoke test wheel
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/python -m pip install --disable-pip-version-check -q dist/*.whl
          /tmp/smoke-venv/bin/python -c "from eggserve._bin import _find_binary; import subprocess, sys; subprocess.run([sys.executable, '$GITHUB_WORKSPACE/scripts/release_smoke.py', _find_binary()], check=True)"
      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl

  build-macos:
    name: "Build wheel (macOS arm64)"
    runs-on: macos-14
    timeout-minutes: 30
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON }}
      - name: Install Maturin
        run: python -m pip install maturin==1.14.1
      - name: Build distribution binary
        run: cargo build --profile dist --locked -p eggserve-bin
      - name: Stage binary into package
        run: |
          mkdir -p crates/eggserve-python/python/eggserve/bin
          cp target/dist/eggserve crates/eggserve-python/python/eggserve/bin/eggserve
          chmod +x crates/eggserve-python/python/eggserve/bin/eggserve
      - name: Build wheel
        run: |
          cd crates/eggserve-python
          python -m maturin build --release \
            --interpreter python${{ env.PYTHON }} \
            --out "$GITHUB_WORKSPACE/dist"
      - name: Smoke test wheel
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/python -m pip install --disable-pip-version-check -q dist/*.whl
          /tmp/smoke-venv/bin/python -c "from eggserve._bin import _find_binary; import subprocess, sys; subprocess.run([sys.executable, '$GITHUB_WORKSPACE/scripts/release_smoke.py', _find_binary()], check=True)"
      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-macos-arm64
          path: dist/*.whl

  build-windows:
    name: "Build wheel (Windows x86_64)"
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON }}
      - name: Install Maturin
        run: python -m pip install maturin==1.14.1
      - name: Build distribution binary
        run: cargo build --profile dist --locked -p eggserve-bin
      - name: Stage binary into package
        shell: bash
        run: |
          mkdir -p crates/eggserve-python/python/eggserve/bin
          cp target/dist/eggserve.exe crates/eggserve-python/python/eggserve/bin/eggserve.exe
      - name: Build wheel
        shell: bash
        run: |
          cd crates/eggserve-python
          python -m maturin build --release \
            --interpreter python${{ env.PYTHON }} \
            --out "$GITHUB_WORKSPACE/dist"
      - name: Smoke test wheel
        shell: bash
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/Scripts/python -m pip install --disable-pip-version-check -q dist/*.whl
          /tmp/smoke-venv/Scripts/python -c "from eggserve._bin import _find_binary; import subprocess, sys; subprocess.run([sys.executable, '$GITHUB_WORKSPACE/scripts/release_smoke.py', _find_binary()], check=True)"
      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-windows-x86_64
          path: dist/*.whl
