name: Release

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Publish target"
        required: true
        type: choice
        options:
          - none
          - testpypi
          - pypi

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # ring crate ARM assembly requires __ARM_ARCH to be defined for aarch64 cross-compilation
  CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Check release metadata
        run: python3 scripts/check-python-release-metadata.py
      - name: Record git SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Record expected version
        id: version
        run: echo "version=$(grep '^version' Cargo.toml | head -1 | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc - manylinux_2_17
          - name: "Build wheel (Linux x86_64 manylinux)"
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
            artifact: wheel-manylinux-x86_64
            maturin_flags: "--compatibility pypi"
            venv_python: /tmp/smoke-venv/bin/python
            console_script: /tmp/smoke-venv/bin/eggserve
          - name: "Build wheel (Linux aarch64 manylinux)"
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
            artifact: wheel-manylinux-aarch64
            maturin_flags: "--compatibility pypi"
            venv_python: /tmp/smoke-venv/bin/python
            console_script: /tmp/smoke-venv/bin/eggserve
          - name: "Build wheel (Linux armv7 manylinux)"
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            manylinux: "2_17"
            artifact: wheel-manylinux-armv7
            maturin_flags: "--compatibility pypi"
            venv_python: /tmp/smoke-venv/bin/python
            console_script: /tmp/smoke-venv/bin/eggserve

          # Linux musl - musllinux_1_2
          - name: "Build wheel (Linux x86_64 musllinux)"
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: "musllinux_1_2"
            artifact: wheel-musllinux-x86_64
            maturin_flags: "--compatibility pypi"
            venv_python: /tmp/smoke-venv/bin/python
            console_script: /tmp/smoke-venv/bin/eggserve
          - name: "Build wheel (Linux aarch64 musllinux)"
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            manylinux: "musllinux_1_2"
            artifact: wheel-musllinux-aarch64
            maturin_flags: "--compatibility pypi"
            venv_python: /tmp/smoke-venv/bin/python
            console_script: /tmp/smoke-venv/bin/eggserve

          # macOS
          - name: "Build wheel (macOS arm64)"
            os: macos-14
            target: aarch64-apple-darwin
            manylinux: "auto"
            artifact: wheel-macos-arm64
            maturin_flags: ""
            venv_python: /tmp/smoke-venv/bin/python
            console_script: /tmp/smoke-venv/bin/eggserve
          - name: "Build wheel (macOS x86_64)"
            os: macos-13
            target: x86_64-apple-darwin
            manylinux: "auto"
            artifact: wheel-macos-x86_64
            maturin_flags: ""
            venv_python: /tmp/smoke-venv/bin/python
            console_script: /tmp/smoke-venv/bin/eggserve

          # Windows
          - name: "Build wheel (Windows x86_64)"
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "auto"
            artifact: wheel-windows-x86_64
            maturin_flags: ""
            venv_python: /tmp/smoke-venv/Scripts/python
            console_script: /tmp/smoke-venv/Scripts/eggserve.exe
          - name: "Build wheel (Windows arm64)"
            os: windows-latest
            target: aarch64-pc-windows-msvc
            manylinux: "auto"
            artifact: wheel-windows-arm64
            maturin_flags: ""
            venv_python: /tmp/smoke-venv/Scripts/python
            console_script: /tmp/smoke-venv/Scripts/eggserve.exe
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: matrix.os == 'ubuntu-latest' && (contains(matrix.target, 'aarch64-unknown-linux') || contains(matrix.target, 'armv7-unknown-linux'))
        with:
          platforms: linux/${{ startsWith(matrix.target, 'aarch64') && 'arm64' || 'arm/v7' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: "1.14.1"
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: "--profile dist --locked --interpreter python3.11 ${{ matrix.maturin_flags }} --out dist"
          working-directory: crates/eggserve-python
      - name: Verify wheel composition
        shell: bash
        run: python "$GITHUB_WORKSPACE/scripts/check-wheel-composition.py" "$GITHUB_WORKSPACE/crates/eggserve-python/dist"
      - name: Smoke test wheel
        if: "!contains(matrix.target, 'armv7') && !contains(matrix.target, 'musl') && !contains(matrix.target, 'aarch64-pc-windows')"
        shell: bash
        run: |
          python -m venv /tmp/smoke-venv
          ${{ matrix.venv_python }} -m pip install --disable-pip-version-check -q "$GITHUB_WORKSPACE/crates/eggserve-python/dist"/*.whl
          ${{ matrix.console_script }} --help >/dev/null
          ${{ matrix.venv_python }} -m eggserve --help >/dev/null
          ${{ matrix.venv_python }} "$GITHUB_WORKSPACE/scripts/release_smoke.py"
      - name: Smoke test wheel (QEMU ARMv7)
        if: contains(matrix.target, 'armv7')
        shell: bash
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$GITHUB_WORKSPACE/crates/eggserve-python/dist:/wheels:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            arm32v7/python:3.11-bookworm \
            bash -c '
              pip install --disable-pip-version-check -q /wheels/*.whl
              python -c "import eggserve; import eggserve._native; print(f\"version={eggserve.__version__}\")"
              eggserve --help >/dev/null
              python -m eggserve --help >/dev/null
              python /scripts/release_smoke.py
            '
      - name: "Stable ABI proof: same wheel on CPython 3.14"
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Run ABI proof smoke
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          python3.14 -m venv /tmp/smoke-venv-314
          /tmp/smoke-venv-314/bin/python -m pip install --disable-pip-version-check -q "$GITHUB_WORKSPACE/crates/eggserve-python/dist"/*.whl
          /tmp/smoke-venv-314/bin/python -c "import eggserve; import eggserve._native; print(f'version={eggserve.__version__}')"
          /tmp/smoke-venv-314/bin/eggserve --help >/dev/null
          /tmp/smoke-venv-314/bin/python -m eggserve --help >/dev/null
          /tmp/smoke-venv-314/bin/python "$GITHUB_WORKSPACE/scripts/release_smoke.py"
      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: crates/eggserve-python/dist/*.whl

  aggregate:
    name: Aggregate wheel set
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Download all wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-wheels
          merge-multiple: true
      - name: Aggregate and verify wheel set
        shell: bash
        run: |
          mkdir -p dist
          cp all-wheels/*.whl dist/
          python scripts/check-release-wheel-set.py dist --version "${{ needs.preflight.outputs.version }}"
      - name: Generate release manifest
        shell: bash
        run: |
          echo "Source: ${{ needs.preflight.outputs.sha }}" > dist/MANIFEST
          echo "Version: ${{ needs.preflight.outputs.version }}" >> dist/MANIFEST
          echo "" >> dist/MANIFEST
          echo "Wheel files and SHA-256 digests:" >> dist/MANIFEST
          for whl in dist/*.whl; do
            sha256sum "$whl" >> dist/MANIFEST
          done
      - name: Upload release wheel set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-wheel-set
          path: |
            dist/*.whl
            dist/MANIFEST

  publish-testpypi:
    name: Publish to TestPyPI
    needs: aggregate
    if: inputs.publish_target == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    environment: testpypi
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-wheel-set
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: aggregate
    if: inputs.publish_target == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-wheel-set
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  post-publish:
    name: "Post-publish smoke: ${{ matrix.name }}"
    needs: [preflight, publish-testpypi, publish-pypi]
    if: always() && (needs.publish-testpypi.result == 'success' || needs.publish-pypi.result == 'success')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux x86_64"
            os: ubuntu-latest
          - name: "Linux aarch64"
            os: ubuntu-24.04-arm
          - name: "Linux musl (Alpine)"
            os: ubuntu-latest
          - name: "macOS arm64"
            os: macos-14
          - name: "Windows x86_64"
            os: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: matrix.name != 'Linux musl (Alpine)'
        with:
          python-version: "3.11"
      - name: Install from PyPI (native)
        if: "!contains(matrix.name, 'musl')"
        shell: bash
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          if [ "${{ needs.publish-testpypi.result }}" = "success" ]; then
            pip install --index-url https://test.pypi.org/simple/ --only-binary=:all: "eggserve==${VERSION}"
          else
            pip install --only-binary=:all: "eggserve==${VERSION}"
          fi
      - name: Smoke test (native)
        if: "!contains(matrix.name, 'musl')"
        shell: bash
        run: |
          eggserve --help >/dev/null
          python -m eggserve --help >/dev/null
          python scripts/release_smoke.py
      - name: Install from PyPI (musl Alpine container)
        if: contains(matrix.name, 'musl')
        shell: bash
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          INDEX_URL="https://pypi.org/simple/"
          if [ "${{ needs.publish-testpypi.result }}" = "success" ]; then
            INDEX_URL="https://test.pypi.org/simple/"
          fi
          docker run --rm \
            -v "$(pwd)/scripts:/scripts:ro" \
            python:3.11-alpine \
            sh -c "
              pip install --no-cache-dir --index-url ${INDEX_URL} 'eggserve==${VERSION}'
              python -c \"import eggserve; import eggserve._native; print(f'version={eggserve.__version__}')\"
              eggserve --help >/dev/null
              python -m eggserve --help >/dev/null
              python /scripts/release_smoke.py
            "
