name: Release

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Publish target"
        required: true
        type: choice
        options:
          - none
          - testpypi
          - pypi

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # ring crate ARM assembly requires __ARM_ARCH to be defined for aarch64 cross-compilation
  CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.98.1
      - name: Record release compiler
        run: rustc -vV
      - name: Install pinned supply-chain tools
        run: bash scripts/install-cargo-tools.sh
      - name: Audit every distributed dependency closure
        run: bash scripts/check-supply-chain.sh
      - name: Check release metadata
        run: python3 scripts/check-python-release-metadata.py
      - name: Validate wheel-target authority
        run: |
          python3 scripts/wheel-matrix.py validate
          python3 scripts/wheel-matrix.py self-test
          python3 scripts/check-release-wheel-set.py --self-test
          python3 scripts/check-release-workflow.py
          python3 scripts/check-release-workflow.py --self-test
      - name: Emit wheel build matrix
        id: matrix
        run: |
          MATRIX_JSON="$(python3 scripts/wheel-matrix.py emit-matrix)"
          echo "$MATRIX_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'{len(d)} required targets')"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
      - name: Record git SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Record expected version
        id: version
        run: echo "version=$(grep '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The build matrix comes from the preflight-generated manifest authority
      # (release/wheel-matrix.toml); no second platform list lives here.
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          # Release builds use an exact patch release; compatibility testing
          # remains in the floating stable CI/platform lanes.
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: matrix.qemu_platform != ''
        with:
          platforms: ${{ matrix.qemu_platform }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: "1.14.1"
          target: ${{ matrix.target }}
          # Plan 268 Track A: `manylinux` is the container/platform baseline
          # only (2_17, musllinux_1_2, or auto). Never pass `pypi` here.
          manylinux: ${{ matrix.manylinux }}
          # `compatibility` carries the maturin `--compatibility` PyPI policy
          # separately (pypi for all release targets).
          args: "--profile dist --locked --interpreter python3.11 --compatibility ${{ matrix.compatibility }} --out dist"
          working-directory: crates/eggserve-python
      - name: Verify wheel composition
        shell: bash
        run: python "$GITHUB_WORKSPACE/scripts/check-wheel-composition.py" "$GITHUB_WORKSPACE/crates/eggserve-python/dist"
      # Plan 268 Track B: only `smoke == 'native'` runs on the build host.
      # Deferred artifacts (deferred-native/deferred-container) are built and
      # uploaded here but never installed on an incompatible build host;
      # execution belongs to their native qualifier jobs.
      - name: Smoke test wheel (native)
        if: matrix.smoke == 'native'
        shell: bash
        run: |
          python -m venv /tmp/smoke-venv
          ${{ matrix.venv_python }} -m pip install --disable-pip-version-check -q --only-binary=:all: "$GITHUB_WORKSPACE/crates/eggserve-python/dist"/*.whl
          ${{ matrix.console_script }} --help >/dev/null
          ${{ matrix.venv_python }} -m eggserve --help >/dev/null
          ${{ matrix.venv_python }} "$GITHUB_WORKSPACE/scripts/release_smoke.py"
          ${{ matrix.venv_python }} "$GITHUB_WORKSPACE/scripts/abi_smoke.py"
      - name: Smoke test wheel (QEMU)
        # Plan 268 Track D: matching ARM userspace via QEMU. Alpine/musl
        # images are minimal and may not contain bash, so invoke `sh -c`.
        if: matrix.smoke == 'qemu'
        shell: bash
        run: |
          docker run --rm --platform ${{ matrix.qemu_platform }} \
            -v "$GITHUB_WORKSPACE/crates/eggserve-python/dist:/wheels:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            ${{ matrix.qemu_image }} \
            sh -c '
              pip install --disable-pip-version-check -q --only-binary=:all: /wheels/*.whl
              python -c "import eggserve; import eggserve._native; print(f\"version={eggserve.__version__}\")"
              eggserve --help >/dev/null
              python -m eggserve --help >/dev/null
              python /scripts/release_smoke.py
              python /scripts/abi_smoke.py
            '
      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: crates/eggserve-python/dist/*.whl

  abi-proof:
    # Plan 264 Track B: build-once, test-many. The exact Linux x86_64
    # cp311-abi3 artifact from the build matrix is installed with
    # binary-only resolution on every supported CPython minor.
    # Plan 268 Track F: until final CPython 3.15 is available through the
    # pinned setup-python action, 3.15 lanes resolve 3.15 RC builds via
    # allow-prereleases. Remove once final 3.15 resolves without it, and
    # record the exact interpreter in evidence (see install step below).
    name: "ABI proof (CPython ${{ matrix.python-version }})"
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Download representative wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheel-manylinux-x86_64
          path: abi-wheel
      - name: Install same wheel bytes (binary-only)
        shell: bash
        run: |
          python -m venv /tmp/abi-venv
          /tmp/abi-venv/bin/python -m pip install --disable-pip-version-check -q --only-binary=:all: abi-wheel/*.whl
          echo "wheel: $(ls abi-wheel/*.whl)"
          /tmp/abi-venv/bin/python -c "import sys; print(f'interpreter={sys.version}')"
      - name: Run ABI proof smoke
        shell: bash
        run: |
          /tmp/abi-venv/bin/python -c "import eggserve; import eggserve._native; print(f'version={eggserve.__version__}')"
          /tmp/abi-venv/bin/eggserve --help >/dev/null
          /tmp/abi-venv/bin/python -m eggserve --help >/dev/null
          /tmp/abi-venv/bin/python scripts/release_smoke.py
          /tmp/abi-venv/bin/python scripts/abi_smoke.py

  qualify-aarch64-glibc:
    # Plan 268 Track C: the cross-built AArch64 glibc artifact executes
    # natively on the ARM64 hosted runner. Only the manylinux wheel is
    # installed here; the musllinux wheel belongs to qualify-aarch64-musl
    # (a musllinux install on glibc Ubuntu is not qualification).
    # Endpoint coverage uses both ends of the supported CPython range
    # (3.11 minimum, 3.15 maximum per Plan 266; 3.15 via prerelease until
    # final per Track F).
    name: "Native AArch64 glibc (CPython ${{ matrix.python-version }})"
    needs: [preflight, build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Record native evidence
        shell: bash
        run: |
          uname -a
          python -c "import platform; print(f'machine={platform.machine()}')"
          python -c "import platform; print(f'python={platform.python_version()}')"
          python -c "import sys; print(f'interpreter={sys.version}')"
          python -c "import ctypes; f=ctypes.CDLL(None).gnu_get_libc_version; f.restype=ctypes.c_char_p; print(f'libc=glibc {f().decode()}')"
      - name: Download AArch64 glibc artifact only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheel-manylinux-aarch64
          path: aarch64-glibc-wheel
      - name: Smoke AArch64 glibc wheel natively (binary-only)
        shell: bash
        run: |
          echo "wheel: $(ls aarch64-glibc-wheel/*.whl)"
          python -m venv /tmp/aarch64-venv
          /tmp/aarch64-venv/bin/python -m pip install --disable-pip-version-check -q --only-binary=:all: aarch64-glibc-wheel/*.whl
          /tmp/aarch64-venv/bin/python -c "import eggserve; import eggserve._native; print(f'version={eggserve.__version__}')"
          /tmp/aarch64-venv/bin/eggserve --help >/dev/null
          /tmp/aarch64-venv/bin/python -m eggserve --help >/dev/null
          /tmp/aarch64-venv/bin/python scripts/release_smoke.py
          /tmp/aarch64-venv/bin/python scripts/abi_smoke.py

  qualify-aarch64-musl:
    # Plan 268 Track C: the cross-built AArch64 musl artifact executes
    # natively on the ARM64 hosted runner inside a matching AArch64
    # Alpine/musl container (never a glibc-host install).
    name: "Native AArch64 musl (Alpine container)"
    needs: [preflight, build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - name: Record native evidence
        shell: bash
        run: |
          uname -a
          docker run --rm --platform linux/arm64 python:3.11-alpine sh -c 'cat /etc/alpine-release; python --version; uname -m'
      - name: Download AArch64 musl artifact only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheel-musllinux-aarch64
          path: aarch64-musl-wheel
      - name: Smoke AArch64 musl wheel in native Alpine container
        shell: bash
        run: |
          echo "wheel: $(ls aarch64-musl-wheel/*.whl)"
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE/aarch64-musl-wheel:/wheels:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            python:3.11-alpine \
            sh -c '
              cat /etc/alpine-release
              python --version
              uname -m
              pip install --disable-pip-version-check -q --only-binary=:all: /wheels/*.whl
              python -c "import eggserve; import eggserve._native; print(f\"version={eggserve.__version__}\")"
              eggserve --help >/dev/null
              python -m eggserve --help >/dev/null
              python /scripts/release_smoke.py
              python /scripts/abi_smoke.py
            '

  qualify-windows-arm64:
    # Plan 268 Track B+E: the cross-built win_arm64 artifact executes natively
    # on the Windows ARM64 hosted runner. This is a required release gate
    # (see aggregate `needs:`): win_arm64 stays a required published artifact,
    # so its native qualification must succeed before aggregation. No
    # `continue-on-error` is permitted here.
    name: "Native Windows ARM64"
    needs: [preflight, build]
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Record native evidence
        shell: pwsh
        run: |
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsBuildNumber
          Get-Volume -DriveLetter $env:SystemDrive.TrimEnd(':') | Select-Object DriveLetter,FileSystem,FileSystemLabel
          python -c "import platform; print(platform.machine(), platform.python_version())"
      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheel-windows-arm64
          path: win-arm64-wheel
      - name: Smoke Windows ARM64 wheel natively
        shell: bash
        run: |
          python -m venv /tmp/win-arm64-venv
          /tmp/win-arm64-venv/Scripts/python -m pip install --disable-pip-version-check -q --only-binary=:all: win-arm64-wheel/*.whl
          echo "wheel: $(ls win-arm64-wheel/*.whl)"
          /tmp/win-arm64-venv/Scripts/python -c "import eggserve; import eggserve._native; print(f'version={eggserve.__version__}')"
          /tmp/win-arm64-venv/Scripts/eggserve.exe --help
          /tmp/win-arm64-venv/Scripts/python -m eggserve --help
          /tmp/win-arm64-venv/Scripts/python scripts/release_smoke.py
          /tmp/win-arm64-venv/Scripts/python scripts/abi_smoke.py

  aggregate:
    # Plan 268 Track E (highest-priority corrective): aggregate must not run
    # unless every required qualification gate succeeded. Pre-publication
    # qualification carries the mandatory release gate because
    # post-publication smoke cannot protect an already-completed upload.
    name: Aggregate wheel set
    needs: [preflight, build, abi-proof, qualify-aarch64-glibc, qualify-aarch64-musl, qualify-windows-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Download all wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-wheels
          merge-multiple: true
      - name: Aggregate and verify wheel set
        shell: bash
        run: |
          mkdir -p dist
          cp all-wheels/*.whl dist/
          python scripts/check-release-wheel-set.py dist --version "${{ needs.preflight.outputs.version }}"
      - name: Generate release manifest
        shell: bash
        run: |
          echo "Source: ${{ needs.preflight.outputs.sha }}" > dist/MANIFEST
          echo "Version: ${{ needs.preflight.outputs.version }}" >> dist/MANIFEST
          echo "Matrix authority: release/wheel-matrix.toml@$(sha256sum release/wheel-matrix.toml | cut -d' ' -f1)" >> dist/MANIFEST
          echo "" >> dist/MANIFEST
          echo "Wheel files and SHA-256 digests:" >> dist/MANIFEST
          for whl in dist/*.whl; do
            sha256sum "$whl" >> dist/MANIFEST
          done
      - name: Upload release wheel set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-wheel-set
          path: |
            dist/*.whl
            dist/MANIFEST

  publish-testpypi:
    name: Publish to TestPyPI
    needs: aggregate
    if: inputs.publish_target == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    environment: testpypi
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-wheel-set
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: aggregate
    if: inputs.publish_target == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-wheel-set
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  post-publish:
    # Plan 264 Track E + Plan 266 Track F + Plan 268 Tracks C/D/F: binary-only
    # install smoke across the published matrix, including both ends of the
    # CPython range (3.11 minimum, 3.15 maximum; 3.15 via prerelease until
    # final) on the representative host. ARMv7 lanes execute under a matching
    # ARMv7 userspace via QEMU with explicit binfmt setup (never rely on
    # runner-global state). AArch64 musl uses the native ARM64 Alpine pattern.
    # Alpine/QEMU lanes use `sh -c` (minimal images may lack bash) and run
    # both release and ABI smokes. If a hosted runner cannot execute one
    # target, the limitation is documented in docs/release-process.md.
    name: "Post-publish smoke: ${{ matrix.name }} (CPython ${{ matrix.python-version }})"
    needs: [preflight, publish-testpypi, publish-pypi]
    if: always() && (needs.publish-testpypi.result == 'success' || needs.publish-pypi.result == 'success')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux x86_64 glibc (min)"
            os: ubuntu-latest
            mode: native
            python-version: "3.11"
          - name: "Linux x86_64 glibc (max)"
            os: ubuntu-latest
            mode: native
            python-version: "3.15"
          - name: "Linux aarch64 glibc"
            os: ubuntu-24.04-arm
            mode: native
            python-version: "3.11"
          - name: "Linux armv7 glibc"
            os: ubuntu-latest
            mode: qemu-glibc-armv7
            python-version: "3.11"
          - name: "Linux x86_64 musl (Alpine)"
            os: ubuntu-latest
            mode: alpine
            python-version: "3.11"
          - name: "Linux aarch64 musl (Alpine)"
            os: ubuntu-24.04-arm
            mode: alpine
            python-version: "3.11"
          - name: "Linux armv7 musl (Alpine)"
            os: ubuntu-latest
            mode: qemu-musl-armv7
            python-version: "3.11"
          - name: "macOS arm64"
            os: macos-14
            mode: native
            python-version: "3.11"
          - name: "Windows x86_64"
            os: windows-latest
            mode: native
            python-version: "3.11"
          - name: "Windows ARM64"
            os: windows-11-arm
            mode: native
            python-version: "3.11"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      # Plan 268 Track D: explicit QEMU/binfmt setup before any linux/arm/v7
      # Docker invocation. Do not rely on runner-global binfmt state.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: matrix.mode == 'qemu-glibc-armv7' || matrix.mode == 'qemu-musl-armv7'
        with:
          platforms: linux/arm/v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: matrix.mode == 'native'
        with:
          python-version: ${{ matrix.python-version }}
          # Plan 268 Track F: 3.15 prerelease resolution until final is
          # available via the pinned action. Remove once final resolves.
          allow-prereleases: true
      - name: Install from index (native, binary-only)
        if: matrix.mode == 'native'
        shell: bash
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          python -c "import sys; print(f'interpreter={sys.version}')"
          if [ "${{ needs.publish-testpypi.result }}" = "success" ]; then
            pip install --index-url https://test.pypi.org/simple/ --only-binary=:all: "eggserve==${VERSION}"
          else
            pip install --only-binary=:all: "eggserve==${VERSION}"
          fi
          pip show -f eggserve | grep -E "^(Name|Version|Location)" || true
          python -c "import eggserve; import eggserve._native; print(f'version={eggserve.__version__}')"
      - name: Smoke test (native)
        if: matrix.mode == 'native'
        shell: bash
        run: |
          eggserve --help >/dev/null
          python -m eggserve --help >/dev/null
          python scripts/release_smoke.py
          python scripts/abi_smoke.py
      - name: Install and smoke from index (musl Alpine container)
        if: matrix.mode == 'alpine'
        shell: bash
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          INDEX_URL="https://pypi.org/simple/"
          if [ "${{ needs.publish-testpypi.result }}" = "success" ]; then
            INDEX_URL="https://test.pypi.org/simple/"
          fi
          docker run --rm \
            -v "$(pwd)/scripts:/scripts:ro" \
            python:3.11-alpine \
            sh -c "
              pip install --no-cache-dir --only-binary=:all: --index-url ${INDEX_URL} 'eggserve==${VERSION}'
              python -c \"import eggserve; import eggserve._native; print(f'version={eggserve.__version__}')\"
              eggserve --help >/dev/null
              python -m eggserve --help >/dev/null
              python /scripts/release_smoke.py
              python /scripts/abi_smoke.py
            "
      - name: Install and smoke from index (QEMU ARMv7)
        # Plan 268 Track D: matching ARMv7 userspace (glibc bookworm vs musl
        # Alpine), `sh -c` for minimal images, binary-only install, both
        # smokes. QEMU setup is the explicit step above.
        if: matrix.mode == 'qemu-glibc-armv7' || matrix.mode == 'qemu-musl-armv7'
        shell: bash
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          INDEX_URL="https://pypi.org/simple/"
          if [ "${{ needs.publish-testpypi.result }}" = "success" ]; then
            INDEX_URL="https://test.pypi.org/simple/"
          fi
          if [ "${{ matrix.mode }}" = "qemu-glibc-armv7" ]; then
            IMAGE="arm32v7/python:3.11-bookworm"
          else
            IMAGE="arm32v7/python:3.11-alpine"
          fi
          docker run --rm --platform linux/arm/v7 \
            -v "$(pwd)/scripts:/scripts:ro" \
            "$IMAGE" \
            sh -c "
              pip install --disable-pip-version-check -q --only-binary=:all: --index-url ${INDEX_URL} 'eggserve==${VERSION}'
              python -c \"import eggserve; import eggserve._native; print(f'version={eggserve.__version__}')\"
              eggserve --help >/dev/null
              python -m eggserve --help >/dev/null
              python /scripts/release_smoke.py
              python /scripts/abi_smoke.py
            "
