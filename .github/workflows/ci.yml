name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    # The complete stable + MSRV + H2 + H3 qualification matrix routinely
    # exceeds fifteen minutes on a cold runner; keep the timeout above the
    # full required sequence so the final H3 gate is actually observable.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: Validate conformance matrix
        run: python3 scripts/verify-conformance-matrix.py
      - name: Validate crate dependency topology
        run: python3 scripts/check-crate-topology.py
      - name: Release metadata sync
        run: python3 scripts/check-python-release-metadata.py
      - name: Wheel-target authority
        run: |
          python3 scripts/wheel-matrix.py validate
          python3 scripts/wheel-matrix.py self-test
          python3 scripts/check-release-wheel-set.py --self-test
          python3 scripts/check-release-workflow.py
          python3 scripts/check-release-workflow.py --self-test
      - name: Format check
        run: cargo fmt --all -- --check
      - name: MSRV check
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.89
      - name: MSRV cargo check
        run: cargo +1.89 check --workspace --all-targets
      - name: MSRV HTTP/2 cargo check
        run: cargo +1.89 check --workspace --all-targets --features http2,tls
      - name: MSRV HTTP/3 cargo check
        run: cargo +1.89 check --workspace --all-targets --features http3,tls
      - name: MSRV HTTP interop and Tower cargo checks
        run: |
          cargo +1.89 check -p eggserve-server --all-targets --no-default-features --features http-interop
          cargo +1.89 check -p eggserve-server --all-targets --no-default-features --features tower
          cargo +1.89 check -p eggserve-core --all-targets --no-default-features --features http-interop
          cargo +1.89 check -p eggserve-core --all-targets --no-default-features --features tower
      - name: Restore stable toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - name: Clippy
        run: cargo clippy --workspace --lib --bins --tests -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: HTTP interop and Tower qualification
        run: |
          cargo clippy -p eggserve-server --no-default-features --features tower --lib --tests -- -D warnings
          cargo test -p eggserve-server --no-default-features --features tower
          cargo clippy -p eggserve-core --no-default-features --features tower --lib --tests -- -D warnings
          cargo test -p eggserve-core --no-default-features --features tower
          cargo test -p eggserve-core --no-default-features --features http-interop --lib
      - name: Check excluded Python crate
        run: cargo check --manifest-path crates/eggserve-python/Cargo.toml --locked
      - name: Python-facing lint lanes
        # Plan 313: the excluded Python crate is outside the workspace, so
        # `cargo clippy --workspace` never sees it. Separately, the
        # `python-bindings-internal` feature compiles the Python-facing bridge
        # code inside eggserve-static and eggserve-core, which the default
        # feature set never compiles. Both paths are linted here so neither
        # can rot unnoticed.
        run: |
          cargo clippy --manifest-path crates/eggserve-python/Cargo.toml --lib -- -D warnings
          cargo clippy -p eggserve-static --features python-bindings-internal --lib --tests -- -D warnings
          cargo clippy -p eggserve-core --features python-bindings-internal --lib --tests -- -D warnings
      - name: Build fuzz harness
        # Plan 310: the fuzz crate is its own workspace and is therefore not
        # covered by `cargo test --workspace`. Without this gate its targets
        # can rot without detection — four of eleven did before Plan 310.
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked
      - name: Lint and format-check fuzz harness
        run: |
          cargo clippy --manifest-path fuzz/Cargo.toml --bins -- -D warnings
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Server TLS lint and tests
        run: |
          cargo clippy -p eggserve-bin --features tls --lib --bins --tests -- -D warnings
          cargo test -p eggserve-bin --features tls
      - name: HTTP/2 and TLS lint and tests
        run: |
          cargo clippy -p eggserve-core --features http2,tls --lib --tests -- -D warnings
          cargo test -p eggserve-core --features http2,tls
          cargo clippy -p eggserve-bin --features http2,tls --lib --bins --tests -- -D warnings
          cargo test -p eggserve-bin --features http2,tls
      - name: HTTP/3 and TLS lint and tests
        run: |
          cargo clippy -p eggserve-core --features http3,tls --lib --tests -- -D warnings
          cargo test -p eggserve-core --features http3,tls
          cargo clippy -p eggserve-bin --features http3,tls --lib --bins --tests -- -D warnings
          cargo test -p eggserve-bin --features http3,tls

  platform-compile:
    name: platform-compile (${{ matrix.os }})
    # Plan 312: routine compile coverage for the platforms the product claims
    # to support. Native hosted runners are used deliberately: the Windows
    # confinement implementation is `#[cfg(windows)]`, and a Linux-hosted
    # cross-check either skips it or builds the wrong ABI flavor. This is
    # compile coverage only — runtime qualification stays manual
    # (`.github/workflows/platform-qualification.yml`) and the Windows
    # security posture stays "functional-only".
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Workspace compile (all targets)
        run: cargo check --workspace --all-targets
      - name: HTTP/2 and TLS feature lane compile
        run: cargo check --workspace --all-targets --features http2,tls
      - name: HTTP/3 and TLS feature lane compile
        run: cargo check --workspace --all-targets --features http3,tls
      - name: Excluded Python crate compile
        run: cargo check --manifest-path crates/eggserve-python/Cargo.toml --locked
      - name: Windows confinement clippy lane
        # Plan 313: `clippy::undocumented_unsafe_blocks` only fires on code the
        # compilation unit actually compiles. The Windows FFI boundary lives in
        # `#[cfg(windows)]` code, so a Linux-hosted lane cannot enforce it.
        # The Windows leg of this job is where that policy is actually checked.
        if: runner.os == 'Windows'
        run: cargo clippy -p eggserve-static --lib -- -D warnings

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: Install pinned supply-chain tools
        run: bash scripts/install-cargo-tools.sh
      - name: Audit every distributed dependency closure
        run: bash scripts/check-supply-chain.sh

  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: Release metadata sync (fail cheaply before wheel build)
        run: python3 scripts/check-python-release-metadata.py
      - name: Install Maturin
        run: python -m pip install maturin==1.14.1
      - name: Build, install, smoke, and test wheel
        run: bash scripts/test-python-wheel.sh
